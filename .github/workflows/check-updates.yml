name: check-updates

on:
  schedule:
    - cron: '17 13 * * 1'   # Mondays, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Check upstream sources
        id: check
        env:
          PYTHONPATH: scripts
        run: |
          # local/ is gitignored, so it does not exist on a fresh runner.
          # check_updates.py creates it, but not until it writes --json at the
          # very end, and tee opens its file when the pipeline starts.
          mkdir -p local

          # Without pipefail the pipeline reports tee's status rather than the
          # checker's, so exit 2 (something moved) reads as success. Capturing
          # explicitly also keeps `bash -e` from aborting on that 2 before the
          # output is written.
          set -o pipefail
          rc=0
          python scripts/check_updates.py --write --json local/report.json \
            | tee local/report.txt || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          # 0 is nothing moved and 2 is something did; both are normal and the
          # run continues to the pull request step. Anything else is a real
          # failure and should stop the run rather than open an empty PR.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

          { echo '```'; cat local/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # A flagged entry (CHANGED, ERROR, PATTERN MISSED) often writes nothing
      # to the catalog, so the pull request step alone would let it pass
      # silently. One standing issue carries every flagged run, and closes
      # itself the first time a run comes back clean.
      - name: Report flagged entries in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.check.outputs.rc }}
          TITLE: 'Upstream check needs attention'
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            cat local/report.txt
            echo '```'
          } > local/issue.md

          num=$(gh issue list --state open --search "in:title \"$TITLE\"" \
                  --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ "$RC" = "2" ]; then
            if [ -n "$num" ]; then
              gh issue comment "$num" --body-file local/issue.md
            else
              gh issue create --title "$TITLE" --body-file local/issue.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Clean run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Rebuild generated files
        env:
          PYTHONPATH: scripts
        run: python scripts/build.py

      # Opens only when --write changed a tracked file. The README carries no
      # build date, so an unchanged catalog produces no diff and this no-ops.
      - name: Open a pull request if anything moved
        uses: peter-evans/create-pull-request@v8
        with:
          branch: upstream-drift
          title: 'Upstream document changes detected'
          commit-message: 'chore: refresh catalog hashes and last_checked'
          body-path: local/report.txt
          add-paths: |
            catalog/
            README.md
            site/index.json
