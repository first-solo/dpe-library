name: check-updates

on:
  schedule:
    - cron: '17 13 * * 1'   # Mondays, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Check upstream sources
        id: check
        env:
          PYTHONPATH: scripts
        run: |
          # local/ is gitignored, so it does not exist on a fresh runner.
          # check_updates.py creates it, but not until it writes --json at the
          # very end, and tee opens its file when the pipeline starts.
          mkdir -p local

          # Without pipefail the pipeline reports tee's status rather than the
          # checker's, so exit 2 (something moved) reads as success. Capturing
          # explicitly also keeps `bash -e` from aborting on that 2 before the
          # output is written.
          set -o pipefail
          rc=0
          python scripts/check_updates.py --write --json local/report.json \
            | tee local/report.txt || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          # 0 is nothing moved and 2 is something did; both are normal and the
          # run continues to the pull request step. Anything else is a real
          # failure and should stop the run rather than open an empty PR.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Rebuild generated files
        env:
          PYTHONPATH: scripts
        run: python scripts/build.py

      - name: Open a pull request if anything moved
        uses: peter-evans/create-pull-request@v8
        with:
          branch: upstream-drift
          title: 'Upstream document changes detected'
          commit-message: 'chore: refresh catalog hashes and last_checked'
          body-path: local/report.txt
          add-paths: |
            catalog/
            README.md
            site/index.json
